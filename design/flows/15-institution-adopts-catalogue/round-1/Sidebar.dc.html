<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shell sidebar (flow 01, as built)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wombat/tokens.css">
<link rel="stylesheet" href="ds/wombat/components/bundle.css">
<link rel="stylesheet" href="f15r1.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<header class="sidebar">
<a class="brand" href="#"><img class="brand-mark" src="/_blob/7d85109844af8d55420d07753d246843" alt=""><span class="brand-word">Wombat</span></a>
<p class="phone-role"><span class="phone-role-label">Acting as</span><span>{{roleLabel}}</span></p>
<label class="nav-toggle-label"><span class="nav-toggle-closed">Menu</span></label>
<div class="nav-panel">
<div class="role-head"><p class="role-now"><span class="role-now-label">Acting as</span><span class="role-now-name">{{roleLabel}}</span></p></div>
<nav class="nav-list" aria-label="Main">
<ul class="nav-items">
<sc-for list="{{items}}" as="item" hint-placeholder-count="8">
<sc-if value="{{item.isHeading}}" hint-placeholder-val="{{false}}"><li><p class="nav-group-heading">{{item.label}}</p></li></sc-if>
<sc-if value="{{item.isLink}}" hint-placeholder-val="{{true}}"><li><a class="{{item.cls}}" href="#" aria-current="{{item.current}}"><span class="nav-label">{{item.label}}</span></a></li></sc-if>
</sc-for>
</ul>
<ul class="nav-items nav-personal">
<sc-for list="{{personal}}" as="item" hint-placeholder-count="1">
<li><a class="{{item.cls}}" href="#" aria-current="{{item.current}}"><span class="nav-label">{{item.label}}</span></a></li>
</sc-for>
</ul>
</nav>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["ia","admin","trainee"],"default":"ia"},"lit":{"editor":"text","default":"Curricula"},"merged":{"editor":"boolean","default":false},"$preview":{"width":250,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'ia';
    const lit = this.props.lit ?? 'Curricula';
    const merged = this.props.merged ?? false;
    const L = (label) => ({ isLink: true, isHeading: false, label, cls: label === lit ? 'nav-link active' : 'nav-link', current: label === lit ? 'page' : undefined });
    const H = (label) => ({ isLink: false, isHeading: true, label });
    let items, personal, roleLabel;
    if (role === 'admin') {
      roleLabel = 'Administrator';
      items = [L('Home'), H('‹group, as built›'), L('Curricula'), L('EPAs'), L('Entrustment scales'), H('‹the other links, as built›')];
      personal = [L('My data rights')];
    } else if (role === 'trainee') {
      roleLabel = 'Trainee';
      items = [L('Home'), H('‹the role’s links, as built›')];
      personal = [L('My progress'), L('My data rights')];
    } else {
      roleLabel = 'Institutional admin';
      items = [L('Home'), H('‹group, as built›'), L('Curricula')];
      if (!merged) items.push(L('Curriculum adoptions'));
      items.push(L('EPAs'), L('Entrustment scales'), H('‹group, as built›'), L('Trainees'), L('Entrustment decisions'), H('‹the other links, as built›'));
      personal = [L('My data rights')];
    }
    return { items, personal, roleLabel };
  }
}
</script>
</body>
</html>
