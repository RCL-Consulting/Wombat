<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 06 round 2 · Menus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wombat/components/bundle.css">
<link rel="stylesheet" href="flow06-r2.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="r2-board">
<sc-for list="{{states}}" as="s" hint-placeholder-count="1">
<section class="r2-state">
<p class="r2-cap"><b>{{s.title}}</b> · {{s.cap}}</p>
<div class="r2-clip {{s.clip}}">
<div class="page">
<input type="checkbox" id="nt-{{s.id}}" class="nav-toggle" checked="{{s.open}}" readonly="">
<header class="sidebar">
<a class="brand" href="#"><img class="brand-mark" src="/_blob/d0ffe547ebb511d3f58145477434f9aa" alt="" width="32" height="32"><span class="brand-word">Wombat</span></a>
<p class="phone-role"><span class="phone-role-label">Acting as</span> <span>{{s.role}}</span></p>
<label class="nav-toggle-label" for="nt-{{s.id}}"><span class="nav-toggle-closed"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 6h16M4 18h16"></path></svg>Menu</span><span class="nav-toggle-open"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"></path></svg>Close</span></label>
<nav class="nav-panel" aria-label="Main">
<div class="role-head"><p class="role-now"><span class="role-now-label">Acting as</span> <span class="role-now-name">{{s.role}}</span></p><sc-if value="{{s.sw}}"><a class="role-switch" href="#" data-enhance-nav="false"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"></path></svg><span>{{s.sw}}</span></a></sc-if></div>
<div class="nav-list">
<ul class="nav-items">
<sc-for list="{{s.nav}}" as="n">
<li><sc-if value="{{n.lit}}"><a class="nav-link active" href="#" aria-current="page"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg><span class="nav-label">{{n.label}}</span></a></sc-if><sc-if value="{{n.rest}}"><a class="nav-link" href="#"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg><span class="nav-label">{{n.label}}</span></a></sc-if></li>
</sc-for>
</ul>
<ul class="nav-items nav-personal"><li><a class="nav-link" href="#"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg><span class="nav-label">My data rights</span></a></li></ul>
</div>
</nav>
<div class="account-row">
<a class="account-link" href="#" title="{{s.who}}"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8a4 4 0 1 0 8 0a4 4 0 1 0-8 0M6 20a6 6 0 0 1 12 0"></path></svg><span class="account-name">{{s.who}}</span></a>
<form class="sign-out" action="#" method="post"><button type="submit" class="btn btn-outline btn-sm sign-out-button"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Sign out</button></form>
</div>
</header>
<main>
<article>
<div class="header-container"><div><h1>{{s.h1}}</h1><p class="page-subtitle">{{s.sub}}</p></div></div>
<div class="detail-card"><p style="margin: 0">{{s.body}}</p></div>
</article>
</main>
</div>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"show":{"editor":"text","default":""},"open":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":4400}}'>

      award: 'M6 8a6 6 0 1 0 12 0a6 6 0 1 0-12 0M15.477 12.89 17 22l-5-3-5 3 1.523-9.11',
      msg: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',

    return { states: pick.length ? all.filter((s) => pick.indexOf(s.id) >= 0) : all };
  }
}
</script>
</body>
</html>
