<!-- @dsCard group="Data" height=200 subtitle="Under every list that can grow; at either end Previous or Next is aria-disabled, never disabled; with a Label, a navigation landmark" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PagerControls</title>
<style>
  body { padding: 0 var(--space-lg) var(--space-lg); }
  .pv-cap { margin: var(--space-lg) 0 var(--space-sm); color: var(--muted-text); font-size: 0.8rem; }
</style>
</head>
<body>
<p class="pv-cap">Page 1 of 7: Previous aria-disabled (it keeps its place and its focus; a press sends nothing)</p>
<div class="pager">
  <div class="pager-info">Showing 1–20 of 137</div>
  <div class="pager-actions">
    <button type="button" class="btn btn-outline btn-sm" aria-disabled="true">Previous</button>
    <button type="button" class="btn btn-outline btn-sm">Next</button>
  </div>
  <div class="pager-page-size">
    <span class="pager-page-size-label">Per page:</span>
    <select class="form-select form-select-sm pager-page-size-select">
      <option>10</option><option selected>20</option><option>50</option><option>100</option>
    </select>
  </div>
</div>

<p class="pv-cap">With a Label (the Activity inbox's Decided by you): a nav landmark, "Decided by you, pages"; one page, both ends aria-disabled</p>
<nav class="pager" aria-label="Decided by you, pages">
  <div class="pager-info">Showing 1–3 of 3</div>
  <div class="pager-actions">
    <button type="button" class="btn btn-outline btn-sm" aria-disabled="true">Previous</button>
    <button type="button" class="btn btn-outline btn-sm" aria-disabled="true">Next</button>
  </div>
  <div class="pager-page-size">
    <span class="pager-page-size-label">Per page:</span>
    <select class="form-select form-select-sm pager-page-size-select">
      <option>10</option><option selected>20</option><option>50</option><option>100</option>
    </select>
  </div>
</nav>
</body>
</html>
