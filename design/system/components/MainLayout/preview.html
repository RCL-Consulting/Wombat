  <main>
    <div class="top-row auth">
      <a href="#">mohammed.patel@example.org</a>
      <form action="#" method="post">
        <button type="submit" class="btn btn-outline btn-sm">Sign out</button>
      </form>

    <article>
      <div class="header-container">
        <div>
          <h1>Welcome, Mohammed Patel</h1>
          <p class="page-subtitle">Viewing as Assessor</p>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="detail-card detail-card--emphasis">
          <h3><svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4M5 5h14l2 8v6H3v-6z" /></svg> Pending requests</h3>

            <div class="dashboard-metric">
              <span class="dashboard-metric-value">3</span>
              <span class="dashboard-metric-label">assessments awaiting review</span>
            </div>
            <div class="dashboard-card-footer">
              <a href="#" class="btn btn-sm btn-primary">Review inbox &rarr;</a>
            </div>
          </div>
        </div>
        <div class="detail-card">
          <h3><svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3zM12 9v4M12 17h.01" /></svg> Awaiting your review</h3>
